# Repository configuration, managed by the Settings app
# (https://github.com/repository-settings/app). The shared defaults come from
# regulad/.github; this file sets only what is this repository's own.
_extends: .github

repository:
  name: scoop-regulad
  description: >-
    Scoop bucket for Windows with manifests for nssm, retry, tinyxnb and
    decomp-toolkit (dtk)
  homepage: ""
  private: false
  # Topics: comma-and-space separated string, NOT a YAML list.
  topics: scoop, scoop-bucket, windows, powershell, package-manager
  default_branch: master

# Labels this repository adds to the shared ones. `color` is a hex string
# without the leading `#`.
labels:
  # The package-request issue form (.github/ISSUE_TEMPLATE/package-request.yml)
  # applies it.
  - name: package-request
    color: "0e8a16"
    description: A request to add a package to the bucket
  # Dependabot's, on its pull requests: its one ecosystem here is .github/dependabot.yml's GitHub Actions.
  - name: github_actions
    color: "000000"
    description: Pull requests that update GitHub Actions code
